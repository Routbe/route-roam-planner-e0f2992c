[package]
name = "rout-zk"
version = "1.0.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"
description = "ROUT anonymous booking engine: blind BBS (BLS12-381), Bulletproofs range proofs, Poseidon sparse Merkle nullifiers; fixed memory, allocator-free"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
bls12_381 = { version = "=0.8.0", default-features = false, features = ["groups", "pairings", "experimental"] }
sha2 = { version = "0.10", default-features = false }
zeroize = { version = "1.8", default-features = false }

[dev-dependencies]
serde_json = "1"
hex = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true
incremental = false
